<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Świąteczny Quiz - Otwórz Prezent /title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-image: url('https://images.unsplash.com/photo-1606813908769-3ef22b6c6b95?auto=format&fit=crop&w=1470&q=80');
        background-size: cover;
        background-position: center;
        color: #fff;
        text-align: center;
        padding: 20px;
    }
    .quiz-container {
        background: rgba(0,0,0,0.7);
        padding: 20px;
        border-radius: 15px;
        display: inline-block;
        max-width: 700px;
    }
    .symbol-selection img {
        width: 100px;
        margin: 10px;
        cursor: pointer;
        border: 3px solid transparent;
        border-radius: 10px;
        transition: transform 0.2s, border 0.2s;
    }
    .symbol-selection img:hover {
        transform: scale(1.1);
        border: 3px solid #ffd700;
    }
    .options button {
        display: block;
        width: 60%;
        margin: 10px auto;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        background-color: #ff6b6b;
        color: #fff;
        transition: background 0.2s;
    }
    .options button:hover {
        background-color: #ff8c66;
    }
    .code-display {
        margin-top: 20px;
        font-size: 28px;
        letter-spacing: 5px;
    }
    #result {
        margin-top: 15px;
        font-size: 20px;
    }
</style>
</head>
<body>
<div class="quiz-container">
    <h1>Świąteczny Quiz</h1>
    <div id="symbol-screen">
        <h2>Wybierz swój symbol z torebki prezentowej:</h2>
        <div class="symbol-selection" id="symbol-selection"></div>
    </div>
    <div id="quiz-screen" style="display:none;">
        <p id="question-text"></p>
        <div class="options" id="options-container"></div>
    </div>
    <div class="code-display" id="code-display">_ _ _</div>
    <div id="result"></div>
</div>

<script>
// Lista symboli osób/par z przypisanym 3-cyfrowym kodem
const symbols = [
    {name: 'Karolina & Piotr', img: 'https://img.icons8.com/emoji/96/woman-man.png', code: [3,5,7]},
    {name: 'Kamil & Anna', img: 'https://img.icons8.com/emoji/96/woman-man.png', code: [1,4,6]},
    {name: 'Ciocia Jola', img: 'https://img.icons8.com/emoji/96/woman.png', code: [2,8,0]},
    {name: 'Ciocia Ela', img: 'https://img.icons8.com/emoji/96/woman.png', code: [9,3,1]},
    {name: 'Jakub', img: 'https://img.icons8.com/emoji/96/man.png', code: [5,2,4]},
    {name: 'Babcia Ala', img: 'https://img.icons8.com/emoji/96/woman.png', code: [7,0,6]},
    {name: 'Babcia Jadzia', img: 'https://img.icons8.com/emoji/96/woman.png', code: [8,1,9]},
    {name: 'Wujek Sławek', img: 'https://img.icons8.com/emoji/96/man.png', code: [3,6,2]},
    {name: 'Julia', img: 'https://img.icons8.com/emoji/96/woman.png', code: [4,7,0]},
    {name: 'Alicja', img: 'https://img.icons8.com/emoji/96/woman.png', code: [5,9,1]},
    {name: 'Tomasz', img: 'https://img.icons8.com/emoji/96/man.png', code: [1,7,5]},
    {name: 'Joanna', img: 'https://img.icons8.com/emoji/96/woman.png', code: [9,2,6]},
    {name: 'Mateusz', img: 'https://img.icons8.com/emoji/96/man.png', code: [0,3,8]},
    {name: 'Joanna & Mateusz', img: 'https://img.icons8.com/emoji/96/woman-man.png', code: [4,1,7]}
];

// Lista pytań świątecznych z opcjami
const allQuestions = [
    {text: 'Ile reniferów ciągnie sanie Świętego Mikołaja?', options: ['6','8','10','12'], answer: '8'},
    {text: 'Który miesiąc ma 28 dni?', options: ['luty','grudzień','czerwiec','kwiecień'], answer: 'luty'},
    {text: 'Jeśli są 4 czerwone, 3 złote i 2 srebrne bombki – ile NIE jest zielonych?', options: ['7','9','6','5'], answer: '9'},
    {text: 'Jak nazywa się pomocnik Mikołaja, który mieszka na Biegunie Północnym?', options: ['elf','gnom','mikołaj','renifer'], answer: 'elf'},
    {text: 'Ile świec jest w wieńcu adwentowym?', options: ['3','4','5','6'], answer: '4'},
    {text: 'Jak nazywa się tradycyjny niemiecki piernik świąteczny?', options: ['lebkuchen','piernik','stollen','panettone'], answer: 'lebkuchen'},
];

let selectedSymbol = null;
let code = ['_', '_', '_'];
let currentIndex = 0;

// Wyświetlanie symboli do wyboru
const symbolSelectionDiv = document.getElementById('symbol-selection');
symbols.forEach((sym, idx) => {
    const img = document.createElement('img');
    img.src = sym.img;
    img.title = sym.name;
    img.onclick = () => selectSymbol(idx);
    symbolSelectionDiv.appendChild(img);
});

function selectSymbol(idx){
    selectedSymbol = symbols[idx];
    document.getElementById('symbol-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    code = ['_', '_', '_'];
    currentIndex = 0;
    showQuestion();
}

function showQuestion(){
    if(currentIndex >= 3){
        document.getElementById('quiz-screen').innerHTML = '<h2>Koniec quizu! Twój kod: ' + code.join('') + '</h2>';
        return;
    }
    // losowe pytania z listy
    const question = allQuestions.sort(() => Math.random()-0.5)[currentIndex];
    document.getElementById('question-text').innerText = question.text;
    const optionsDiv = document.getElementById('options-container');
    optionsDiv.innerHTML = '';
    question.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, question.answer);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(selected, correct){
    const resultDiv = document.getElementById('result');
    if(selected.toLowerCase() === correct.toLowerCase()){
        code[currentIndex] = selectedSymbol.code[currentIndex];
        document.getElementById('code-display').innerText = code.join(' ');
        resultDiv.innerText = 'Poprawnie!';
        currentIndex++;
        setTimeout(showQuestion, 800);
    } else {
        resultDiv.innerText = 'Spróbuj jeszcze raz!';
    }
}
</script>
</body>
</html>
