<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Świąteczny Quiz - Otwórz Prezent!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  min-height:100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#2e7d32,#66bb6a);
  color:white;
  text-align:center;
  padding:20px;
  overflow-x:hidden;
  position:relative;
}

h1 { color:#fff; }
button { padding:10px 20px; margin:10px; font-size:16px; cursor:pointer; border:none; border-radius:10px; }

.cifra {
  font-size:32px;
  font-weight:bold;
  color:white;
  background-color:#2e7d32;
  margin:15px;
  padding:15px 20px;
  border-radius:12px;
  display:inline-block;
  opacity:0;
}

.cifra.show {
  animation: bounceRotate 0.6s forwards;
}

@keyframes bounceRotate {
  0% { transform: translateY(0px) rotate(0deg) scale(0.5); opacity:0; }
  30% { transform: translateY(-20px) rotate(120deg) scale(1.2); opacity:1; }
  60% { transform: translateY(5px) rotate(240deg) scale(1.1); }
  100% { transform: translateY(0px) rotate(360deg) scale(1.2); opacity:1; }
}

#quiz { margin-top:20px; }
#code { margin-top:20px; }

.confetti {
  position:fixed;
  width:10px;
  height:10px;
  top:-10px;
  pointer-events:none;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg); opacity:0;}
}

/* Migające światełka w tle */
body::after {
  content:"";
  position:fixed;
  width:100vw;
  height:100vh;
  background: radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px);
  background-size:50px 50px;
  pointer-events:none;
  animation: twinkle 2s infinite;
}

@keyframes twinkle {
  0%,100%{opacity:0.6;}
  50%{opacity:1;}
}
</style>
</head>
<body>

<h1>🎄 Świąteczny Quiz - Otwórz Prezent! 🎁</h1>

<div id="symbolSelection">
  <p>Wybierz swój symbol prezentu:</p>
  <button onclick="startQuiz('🎄')">🎄</button>
  <button onclick="startQuiz('⭐')">⭐</button>
  <button onclick="startQuiz('🔔')">🔔</button>
  <button onclick="startQuiz('❄️')">❄️</button>
  <button onclick="startQuiz('🦌')">🦌</button>
  <button onclick="startQuiz('🎅')">🎅</button>
  <button onclick="startQuiz('⛄')">⛄</button>
  <button onclick="startQuiz('🎁')">🎁</button>
  <button onclick="startQuiz('🕯️')">🕯️</button>
  <button onclick="startQuiz('🍪')">🍪</button>
  <button onclick="startQuiz('🧦')">🧦</button>
  <button onclick="startQuiz('❤️')">❤️</button>
  <button onclick="startQuiz('🔑')">🔑</button>
  <button onclick="startQuiz('💍')">💍</button>
</div>

<div id="quiz" style="display:none;">
  <p id="question"></p>
  <div id="answers"></div>
</div>

<div id="result" style="display:none;">
  <p>Twój kod do kłódki:</p>
  <div id="code"></div>
</div>

<audio id="ding" src="ding.mp3"></audio>

<script>
// Kody do prezentów
const presents = {
  "🎄":"528","⭐":"394","🔔":"712","❄️":"861","🦌":"247",
  "🎅":"905","⛄":"138","🎁":"476","🕯️":"329","🍪":"684",
  "🧦":"570","❤️":"213","🔑":"897","💍":"462"
};

// 20 pytań
const questionsPool = [
  {q:"Ile nóg ma renifer?",a:["4","2","6"],c:"4"},
  {q:"Jakiego koloru jest strój Mikołaja?",a:["Czerwony","Zielony","Niebieski"],c:"Czerwony"},
  {q:"Ile dni ma grudzień?",a:["31","30","28"],c:"31"},
  {q:"Co wkładamy pod obrus w Wigilię?",a:["Sianko","Liście","Papier"],c:"Sianko"},
  {q:"Ile świec jest w wieńcu adwentowym?",a:["4","3","5"],c:"4"},
  {q:"Jak nazywa się pomocnik Mikołaja?",a:["Elf","Gnom","Krasnal"],c:"Elf"},
  {q:"Jakiego koloru są bombki?",a:["Różne","Tylko czerwone","Tylko złote"],c:"Różne"},
  {q:"Co robimy przy kolędzie?",a:["Śpiewamy","Tańczymy","Biegamy"],c:"Śpiewamy"},
  {q:"Ile reniferów ciągnie sanie?",a:["8","9","7"],c:"9"},
  {q:"Jaka roślina wisi nad drzwiami?",a:["Jemioła","Róża","Tulipan"],c:"Jemioła"},
  {q:"Co symbolizuje Gwiazda Betlejemska?",a:["Nadzieję","Prezent","Śnieg"],c:"Nadzieję"},
  {q:"Jakiego zwierzęcia nie kojarzy się z Bożym Narodzeniem?",a:["Owce","Renifer","Sowa"],c:"Sowa"},
  {q:"Jak nazywa się grzany napój?",a:["Grzaniec","Sok","Herbata"],c:"Grzaniec"},
  {q:"Ile prezentów przynosi Mikołaj?",a:["Różnie","0","1"],c:"Różnie"},
  {q:"Jakiego koloru jest gwiazda?",a:["Złota","Niebieska","Zielona"],c:"Złota"},
  {q:"Ile gwiazd w „12 dniach świąt”?",a:["12","10","8"],c:"12"},
  {q:"Jak nazywa się niemiecki piernik?",a:["Lebkuchen","Stollen","Panettone"],c:"Lebkuchen"},
  {q:"W jakim kraju powstała kartka świąteczna?",a:["Anglia","Polska","Niemcy"],c:"Anglia"},
  {q:"Jeśli są 4 czerwone, 3 złote i 2 srebrne bombki – ile NIE jest zielonych?",a:["9","0","10"],c:"9"},
  {q:"W tradycji bożonarodzeniowej skarpety na prezenty wiesza się na kominku.?",a:["Prawda","Fałsz"],c:"Prawda"}
];

let selectedSymbol = "", code = [], digitsRevealed = 0, questions=[];

function startQuiz(symbol){
  selectedSymbol = symbol;
  code = presents[symbol].split(''); // string → tablica
  digitsRevealed = 0;
  questions = shuffleArray([...questionsPool]).slice(0,3);
  document.getElementById("symbolSelection").style.display="none";
  document.getElementById("quiz").style.display="block";
  document.getElementById("code").innerHTML="";
  showQuestion();
}

function showQuestion(){
  if(digitsRevealed >= questions.length){
    showCode();
    return;
  }
  const q = questions[digitsRevealed];
  document.getElementById("question").innerText=q.q;
  const ansDiv=document.getElementById("answers");
  ansDiv.innerHTML="";
  q.a.forEach(ans=>{
    const btn=document.createElement("button");
    btn.innerText=ans;
    btn.onclick=()=>checkAnswer(ans,q.c);
    ansDiv.appendChild(btn);
  });
}

function checkAnswer(answer, correct){
  if(answer===correct){
    revealDigit(digitsRevealed);  // pokazujemy cyfrę dla aktualnego pytania
    launchConfetti(10);
    digitsRevealed++;
    setTimeout(()=>showQuestion(),500);
  } else alert("Spróbuj jeszcze raz!");
}

function revealDigit(index){
  const codeDiv = document.getElementById("code");
  if(codeDiv.children[index]) return;
  const span = document.createElement("span");
  span.className="cifra";
  span.innerText=code[index];
  codeDiv.appendChild(span);
  setTimeout(()=>span.classList.add("show"),50);
}

function showCode(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
}

function launchConfetti(amount=10){
  for(let i=0;i<amount;i++){
    const d=document.createElement("div");
    d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.background=["#c62828","#2e7d32","#ffd700"][Math.floor(Math.random()*3)];
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3000);
  }
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
</script>
</body>
</html>
